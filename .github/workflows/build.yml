name: Build Android APK Smart & Force

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Force Smart Build and Generate APK
        run: |
          cd SandyCareProject
          # توليد ملفات التشغيل تلقائياً لضمان عدم فقدانها
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew
          # محاولة البناء مع تجاوز التحذيرات وإظهار التتبع عند الخطأ
          ./gradlew assembleDebug --stacktrace --continue

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandyCare-Final-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
