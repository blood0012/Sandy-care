name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK using standard commands
        run: |
          export JAVA_HOME=$JAVA_HOME
          # التحقق من وجود ملفات المشروع وبناء التطبيق
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            # إذا لم يكن gradlew موجوداً، نقوم ببنائه بالأداة الافتراضية
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SandyCare-APK
          path: app/build/outputs/apk/debug/app-debug.apk
