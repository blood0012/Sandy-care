name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK with correct path
        run: |
          # التحقق من مكان وجود ملف الإعدادات وبناء المشروع بناءً عليه
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug
          elif [ -d "Sandy-care" ]; then
            cd Sandy-care
            gradle assembleDebug
          else
            # البحث التلقائي عن المجلد الذي يحتوي على بناء أندرويد
            DIR=$(find . -name "build.gradle" -maxdepth 3 | head -n 1 | xargs dirname)
            cd $DIR
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SandyCare-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
